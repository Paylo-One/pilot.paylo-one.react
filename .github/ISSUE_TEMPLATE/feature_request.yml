name: Feature request
description: Suggest a concrete improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, start a [Discussion](../../discussions) instead — feature issues work best when they're specific.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is it for, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Pilot do? Sketches and prior art welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
