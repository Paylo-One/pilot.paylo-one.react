name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:oss
      # Unit tests. The runtime tenant-isolation suite self-skips here (no test
      # DB env), so this stays fast and DB-free.
      - run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_APP_APEX: example.com
          NEXT_PUBLIC_DEV_APEX: lvh.me
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_example
          SUPABASE_SECRET_KEY: sb_secret_ci_example
          PILOT_SIGNUP_MODE: open
          OPENAI_API_KEY: sk-ci-example
        run: npm run build
      # Dependency hygiene: enforce the release-readiness "zero known
      # vulnerabilities" bar on high/critical advisories. Uses audit-ci (over
      # bare `npm audit`) so a small, documented allowlist can carry advisories
      # that have no non-breaking upstream fix without dropping enforcement for
      # everything else. See audit-ci.jsonc for the gate config and the
      # rationale + revert criteria for each allowlisted advisory.
      - name: Dependency audit (high/critical)
        run: npx audit-ci --config ./audit-ci.jsonc

  tenant-isolation:
    name: Tenant isolation (runtime RLS on Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.109.1
      # `supabase start` boots the full local stack (Postgres + Auth/GoTrue +
      # PostgREST) and applies every migration in supabase/migrations, giving a
      # real RLS-enforcing database for the integration test.
      - name: Start Supabase stack
        run: supabase start
      - name: Export test DB env
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=${API_URL}"
            echo "SUPABASE_TEST_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_TEST_SERVICE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      - name: Run runtime tenant-isolation test
        # Same command `scripts/ci-local.sh` runs locally, so CI and local match.
        run: npm run test:integration
      - name: Stop Supabase stack
        if: always()
        run: supabase stop || true
