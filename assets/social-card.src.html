<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 300; src: url('ibm-plex-sans-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url('ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }

  /* Command-layer surface (--colour-surface-command) */
  body {
    background: #16181D;
    font-family: 'IBM Plex Sans', Inter, -apple-system, sans-serif;
    position: relative;
  }

  .frame {
    position: absolute;
    inset: 0;
    padding: 84px 96px 76px 96px;
    display: flex;
    flex-direction: column;
  }

  /* Convergence mark — five weighted signals resolving to a single teal point */
  .mark { display: block; }

  .title {
    margin-top: 42px;
    font-weight: 600;
    font-size: 128px;
    line-height: 1;
    letter-spacing: -2.5px;
    color: #E8EAED;                 /* dark-mode text-primary */
  }

  .subtitle {
    margin-top: 30px;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.42;
    letter-spacing: 0.1px;
    color: #A0A6B0;                 /* dark-mode text-secondary */
    max-width: 820px;
  }

  .footer {
    margin-top: auto;
    border-top: 1px solid #262B33;  /* dark-mode hairline */
    padding-top: 26px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .meta {
    font-family: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.6px;
    color: #2AA7B5;                 /* dark-mode accent — system signature */
  }
  .meta .sep { color: #565D68; padding: 0 10px; }

  .signature {
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 4.2px;
    color: #E8EAED;
    opacity: 0.34;                  /* institutional signature treatment */
  }
</style>
</head>
<body>
  <div class="frame">
    <!-- Convergence mark, dark/command variant, 1.5× -->
    <svg class="mark" width="108" height="96" viewBox="0 0 72 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="3"  x2="62" y2="32" stroke="#E8EAED" stroke-width="1.5" stroke-linecap="round" opacity="0.18"/>
      <line x1="0" y1="16" x2="62" y2="32" stroke="#E8EAED" stroke-width="2"   stroke-linecap="round" opacity="0.35"/>
      <line x1="0" y1="32" x2="62" y2="32" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round" opacity="0.70"/>
      <line x1="0" y1="48" x2="62" y2="32" stroke="#E8EAED" stroke-width="2"   stroke-linecap="round" opacity="0.35"/>
      <line x1="0" y1="61" x2="62" y2="32" stroke="#E8EAED" stroke-width="1.5" stroke-linecap="round" opacity="0.18"/>
      <circle cx="68" cy="32" r="4" fill="#2AA7B5"/>
    </svg>

    <h1 class="title">Pilot</h1>

    <p class="subtitle">A calm intelligence layer for senior technology
    leaders — decisions, context, signals and execution on one surface.</p>

    <div class="footer">
      <div class="meta">daily memo<span class="sep">·</span>news briefing<span class="sep">·</span>actions<span class="sep">·</span>diary</div>
      <div class="signature">PAYLO.ONE</div>
    </div>
  </div>
</body>
</html>
